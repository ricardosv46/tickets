<!--
  Requiere en TicketDetailComponent: imports: [DatePipe, RouterLink]
  y que exista ticket() (computed) que devuelve Ticket | undefined.
-->
<section class="space-y-4">
  <a routerLink="/" class="text-sm text-indigo-600 hover:underline">&larr; Volver a la lista</a>

  @if (ticket(); as t) {
    <article class="rounded-lg border border-slate-200 bg-white p-6">
      <p class="text-xs uppercase text-slate-500">Ticket #{{ t.id }}</p>
      <h2 class="mt-1 text-2xl font-semibold">{{ t.title }}</h2>

      <dl class="mt-6 grid grid-cols-1 gap-4 text-sm sm:grid-cols-3">
        <div>
          <dt class="text-slate-500">Estado</dt>
          <dd class="font-medium">{{ t.status }}</dd>
        </div>
        <div>
          <dt class="text-slate-500">Prioridad</dt>
          <dd class="font-medium">{{ t.priority }}</dd>
        </div>
        <div>
          <dt class="text-slate-500">Creado</dt>
          <dd class="font-medium">{{ t.createdAt | date: 'dd/MM/yyyy HH:mm' }}</dd>
        </div>
      </dl>
    </article>
  } @else if (ticket() === null) {
    <div class="rounded-lg border border-slate-200 bg-white p-6 text-center text-slate-500">
      El ticket no existe.
    </div>
  } @else {
    <div class="rounded-lg border border-slate-200 bg-white p-6 text-center text-slate-500">
      Cargando...
    </div>
  }
</section>
