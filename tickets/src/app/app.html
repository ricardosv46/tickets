<div class="min-h-screen bg-slate-50 text-slate-800">
  <!-- La cabecera solo se ve con sesión iniciada. -->
  @if (authenticated().isAuthenticated) {
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
        <h1 class="text-xl font-semibold tracking-tight">Panel de Tickets</h1>
        <nav class="flex items-center gap-4 text-sm font-medium text-slate-600">
          <a href="/" class="hover:text-indigo-600">Tickets</a>
          <span class="text-slate-500">{{ userData().userData?.email }}</span>
          <button
            type="button"
            (click)="logout()"
            class="rounded-lg border border-slate-300 px-3 py-1 hover:bg-slate-100"
          >
            Salir
          </button>
        </nav>
      </div>
    </header>
  }

  <main class="mx-auto max-w-5xl px-4 py-6">
    <!-- Todas las rutas exigen sesión: sin sesión, el guard ya está redirigiendo a Cognito. -->
    @if (!authenticated().isAuthenticated) {
      <p class="py-24 text-center text-slate-500">Redirigiendo al inicio de sesión...</p>
    }
    <router-outlet />
  </main>
</div>
