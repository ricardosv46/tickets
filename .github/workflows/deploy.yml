name: Build y deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# OIDC: GitHub emite un token temporal que AWS acepta. No hay access keys guardadas.
permissions:
  id-token: write # necesario para pedir el token OIDC
  contents: read

# Un solo deploy a la vez.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tickets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tickets/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build de producción
        run: npm run build

      # --- A partir de aquí solo se despliega al hacer push a main ---

      - name: Credenciales de AWS (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Subir archivos con hash (caché larga)
        if: github.event_name != 'pull_request'
        run: |
          aws s3 sync dist/tickets/browser s3://${{ vars.S3_BUCKET }} \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Subir index.html (sin caché)
        if: github.event_name != 'pull_request'
        run: |
          aws s3 cp dist/tickets/browser/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache"

      - name: Invalidar caché de CloudFront
        if: github.event_name != 'pull_request'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"
